venue:
  name: BINANCE
  account_type: MARGIN
  oms_type: NETTING
  starting_balances:
    - amount: 100000
      currency: USDT

strategy:
  module: strategy
  class: NarrativeMemoryStrategy
  config_class: NarrativeMemoryStrategyConfig
  config:
    order_id_tag: "001"
    trade_size: "1"
    lookback_bars: 6
    momentum_return_pct: 3.0
    fear_drop_pct: 5.0
    fear_market_drop_pct: 3.0
    breakout_volume_multiple: 2.0
    stop_loss_pct: 3.0
    base_take_profit_pct: 6.0
    narrative_mode: "auto"

execution:
  start: "2026-03-01T00:00:00+00:00"
  end: "2026-06-07T00:00:00+00:00"

instruments:
  - id: BTCUSDT.BINANCE
    kind: perpetual
    raw_symbol: BTCUSDT
    base_currency: BTC
    quote_currency: USDT
    settlement_currency: USDT
    price_precision: 4
    size_precision: 3
    price_increment: "0.0001"
    size_increment: "0.001"
    lot_size: "0.001"
    maker_fee: "0.0002"
    taker_fee: "0.0005"
    bar_type: BTCUSDT.BINANCE-4-HOUR-LAST-EXTERNAL
