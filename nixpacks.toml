[phases.setup]
nixPkgs = ["python312", "python312Packages.pip", "nodejs_20"]

[phases.install]
cmds = [
  "pip3 install -r requirements.txt --break-system-packages",
  "npm install -g bitget-hub",
  "npm install -g @bitget-ai/getagent-skill"
]

[start]
cmd = "python3 main.py & python3 -m uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT"