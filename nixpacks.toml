[phases.setup]
nixPkgs = ["nodejs_20", "python312", "python312Packages.pip"]

[phases.install]
cmds = [
  "python -m pip install -r requirements.txt",
  "npm install -g bitget-hub",
  "npm install -g @bitget-ai/getagent-skill"
]

[start]
cmd = "python main.py & uvicorn dashboard.app:app --host 0.0.0.0 --port $PORT"